name: Release a package to npm & GitHub

# Tags are `<package>@<version>`, e.g. `threejs-grass@0.3.0`.
on:
  push:
    tags: ['*@[0-9]*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC); provenance is attached automatically

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's advice: never cache in release builds
      - run: npm ci
      - name: Tag matches the package version
        run: |
          name="${GITHUB_REF_NAME%@*}"
          test "$(npm pkg get version -w "$name" | node -pe "Object.values(JSON.parse(require('fs').readFileSync(0)))[0]")" = "${GITHUB_REF_NAME##*@}"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # dependencies' dist/ is needed for the package's .d.ts build
      # No token: npm authenticates this workflow through the trusted publisher that
      # scripts/publish-all.sh sets up for each package (npm trust github ... --file release.yml).
      - run: npm publish -w "$PACKAGE"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
