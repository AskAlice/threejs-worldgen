<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>threejs-population · sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 ui-monospace, monospace; color: #fff }
      #hud { position: fixed; left: 10px; top: 10px; background: #0009; padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre }
      #map { position: fixed; left: 10px; bottom: 10px; width: 256px; height: 256px; border: 1px solid #fff4; image-rendering: pixelated; background: #123 }
      #help { position: fixed; left: 280px; bottom: 10px; background: #0009; padding: 6px 8px; border-radius: 4px }
    </style>
  </head>
  <body>
    <div id="hud">generating…</div>
    <canvas id="map" width="256" height="256"></canvas>
    <div id="help">drag: orbit · wheel: zoom (the overlay switches to coarser hexagons as you pull away)</div>
    <script type="module" src="./population.ts"></script>
  </body>
</html>
