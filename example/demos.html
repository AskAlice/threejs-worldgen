<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>threejs-worldgen · demos</title>
    <style>
      :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3 }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 20px }
      h1 { margin: 0 0 4px; font-size: 28px }
      p.lead { margin: 0 0 28px; color: #9da7b3 }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
      .card { display: block; padding: 0 0 16px; overflow: hidden; border: 1px solid #30363d; border-radius: 10px; background: #161b22; color: inherit }
      .card > :not(.thumb) { margin-left: 16px; margin-right: 16px }
      .thumb { display: block; aspect-ratio: 16 / 9; margin-bottom: 12px; background: linear-gradient(135deg, #1f2a36, #0d1117); border-bottom: 1px solid #30363d; color: inherit }
      .thumb img { display: block; width: 100%; height: 100%; object-fit: cover }
      .card:hover { border-color: #58a6ff }
      .card b { display: block; font-size: 16px }
      .card span.desc { display: block; margin-top: 6px; color: #9da7b3; font-size: 13px }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
      .btn { padding: 5px 12px; border: 1px solid #30363d; border-radius: 8px; background: #21262d; color: #e6edf3; font-size: 13px; text-decoration: none }
      .btn:hover { border-color: #58a6ff }
      .missing { opacity: 0.45; pointer-events: none }
      .tag { float: right; font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #30363d }
    </style>
  </head>
  <body>
    <main>
      <h1>threejs-worldgen demos</h1>
      <p class="lead">Live sandboxes for every package. One card per demo: the thumbnail opens the three.js version, and a React Three Fiber button appears where that version exists. Packages still being built show as dimmed until their demo page lands.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module">
      // One entry per demo: the three.js page (the card and its thumbnail), the React Three Fiber page when one exists,
      // a description and a thumbnail under site/media/. Thumbnails fall back to a plain tile under the dev server.
      const demos = [
        { name: 'threejs-grass', page: 'index.html', react: 'r3f.html', thumb: 'hero.jpg',
          text: 'Infinite WebGPU grass: presets, LODs, wind, painter (three.js + lil-gui)' },
        { name: 'threejs-grass · corn', page: 'corn.html', react: 'corn-r3f.html', thumb: 'corn/thumb.jpg',
          text: 'Row-planted corn fields: growth stages, harvest stubble, a tractor flattening a track' },
        { name: 'threejs-heightfield', page: 'heightfield.html', react: 'heightfield-r3f.html', thumb: 'heightfield/thumb.jpg',
          text: 'Height functions and meshes baked into heightfields: sampling, slope, ray-marching' },
        { name: 'threejs-biomes', page: 'terrain.html', thumb: 'biomes/thumb.jpg',
          text: '20 biomes, planet or flat world, streaming LOD terrain from orbit to 1 cm, live maps' },
        { name: 'threejs-water', page: 'water.html', thumb: 'water/thumb.jpg',
          text: 'Oceans, noise rivers and bounded hydrology' },
        { name: 'threejs-scatter + trees', page: 'scatter.html', thumb: 'scatter/thumb.jpg',
          text: 'Blue-noise instancing, impostors, procedural trees and rocks' },
        { name: 'threejs-sky', page: 'sky.html', thumb: 'sky/thumb.jpg',
          text: 'Day/night, moon phases, Milky Way, shooting stars, solar system' },
        { name: 'threejs-city', page: 'city.html', react: 'city-r3f.html', thumb: 'city/thumb.jpg',
          text: 'Settlements, roads, blocks, lots and buildings, with every option live in the React version' },
        { name: 'threejs-props', page: 'props.html', react: 'props-r3f.html', thumb: 'props/thumb.jpg',
          text: 'Street and countryside props: mailboxes, power lines, street lights, signs, fences' },
        { name: 'threejs-vehicles', page: 'vehicles.html', react: 'vehicles-r3f.html', thumb: 'vehicles/thumb.jpg',
          text: 'Animated cars, trains, boats and aircraft on generated networks' },
        { name: 'threejs-weathering', page: 'weathering.html', thumb: 'weathering/thumb.jpg',
          text: 'Rain, snow, lightning, wildfires, wet/snowy/burnt/damaged materials' },
        { name: 'threejs-fauna', page: 'fauna.html', react: 'fauna-r3f.html', thumb: 'fauna/thumb.jpg',
          text: 'Procedural fish schools' },
        { name: 'threejs-worldgen', page: 'world.html', thumb: null,
          text: 'Everything together: the combined world' },
      ]
      const grid = document.getElementById('grid')
      const el = (tag, cls, text) => {
        const e = document.createElement(tag)
        if (cls) e.className = cls
        if (text) e.textContent = text
        return e
      }
      // The dev server answers unknown paths with the index page, so a page that just repeats it doesn't exist.
      const indexHtml = await fetch('index.html').then((r) => r.text()).catch(() => '')
      const exists = async (href) => {
        try {
          const r = await fetch(href)
          if (!r.ok || !(r.headers.get('content-type') ?? '').includes('html')) return false
          return href === 'index.html' || (await r.text()) !== indexHtml
        } catch {
          return false
        }
      }
      for (const d of demos) {
        const card = el('div', 'card')
        const thumb = el('a', 'thumb')
        thumb.href = d.page
        if (d.thumb) {
          const img = el('img')
          img.loading = 'lazy'
          img.alt = ''
          img.src = `../media/${d.thumb}`
          img.onerror = () => img.remove()
          thumb.append(img)
        }
        const title = el('b', null, d.name)
        const actions = el('div', 'actions')
        const buttons = [['three.js', d.page], ...(d.react ? [['React Three Fiber', d.react]] : [])].map(([label, href]) => {
          const a = el('a', 'btn', label)
          a.href = href
          actions.append(a)
          return a
        })
        card.append(thumb, title, el('span', 'desc', d.text), actions)
        grid.append(card)
        // Dim a version whose page doesn't exist yet; a demo with no page at all is dimmed and tagged in progress.
        const found = await Promise.all(buttons.map(async (a) => {
          const ok = await exists(a.getAttribute('href') ?? '')
          if (!ok) a.classList.add('missing')
          return ok
        }))
        if (!found[0]) {
          card.classList.add('missing')
          title.insertAdjacentHTML('afterbegin', '<em class="tag">in progress</em>')
        }
      }
    </script>
  </body>
</html>
